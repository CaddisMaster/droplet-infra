version: 2
updates:
  - package-ecosystem: pip
    directory: "/infra"
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies"]
    groups:
      infra-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies"]

  - package-ecosystem: terraform
    directory: "/infra/terraform"
    schedule:
      interval: monthly
    labels: ["dependencies"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies"]
